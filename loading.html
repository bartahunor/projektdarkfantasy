<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betöltés...</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    background: #0a0a0a url('https://i.imgur.com/b5nXJzP.png');
    background-size: 256px;
    font-family: "VT323", monospace;
    color: #ba5c66;
    image-rendering: pixelated;
    overflow: hidden;
}

.loader-container {
    position: relative;
    text-align: center;
    top: 40%;
}

.loader-text {
    font-size: 32px;
    text-shadow: 2px 2px #36191c;
    margin-bottom: 20px;
}

.loader-bar {
    width: 300px;
    height: 25px;
    border: 3px solid #6a353a;
    background: #1a1a1a;
    position: relative;
    overflow: hidden;
    margin: 0 auto;
}

.loader-fill {
    height: 100%;
    background: #9b4d55;
    width: 0%;
    animation: loading 3s linear forwards;
}

@keyframes loading {
    0% { width: 0%; }
    100% { width: 100%; }
}


.rune {
    position: absolute;
    color: #5F2F34;
    font-size: 40px;
    text-shadow: 0 0 5px #ffffff;
    opacity: 0;
    animation: blink 5s infinite;
}

@keyframes blink {
    0%, 50%, 100% { opacity: 0; }
    25%, 75% { opacity: 1; }
}
</style>
</head>

<body>
<div class="loader-container">
    <div class="loader-text">
        <h2>Az Elfeledett Oldalak életre kelnek.</h2>
        <p>Az árnyak suttognak az oldalak között. <br>Olvasd… ha mered.</p></div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
</div>

<audio id="bgMusic" loop>
        <source src="pictures/Tortoise I.mp3" type="audio/mpeg">
</audio>

<script>
// 3 másodperc után átirányítjuk a game.html-re
setTimeout(() => {
    window.location.href = "game.html";
}, 4000);

// Runák létrehozása
const runeChars = ["ᚠ","ᚢ","ᚦ","ᚨ","ᚱ","ᚲ","ᚷ","ᚹ","ᚺ","ᚾ","ᛁ","ᛃ"];
const body = document.body;

for(let i=0; i<30; i++){
    const rune = document.createElement("div");
    rune.className = "rune";
    rune.textContent = runeChars[Math.floor(Math.random()*runeChars.length)];
    rune.style.left = Math.random()*100 + "vw";
    rune.style.top = Math.random()*100 + "vh";
    rune.style.animationDuration = (0.5 + Math.random()*1.5) + "s";
    rune.style.fontSize = (16 + Math.random()*24) + "px";
    body.appendChild(rune);
}

const music = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicToggle");

let musicOn = true;
const DEFAULT_VOLUME = 0.04;
let fadeInterval = null;
let musicStarted = false;

function startMusic() {
    if (musicStarted) return;

    music.volume = DEFAULT_VOLUME;
    music.play().then(() => {
        fadeIn();
        musicBtn.src = "pictures/sound_on.png";
        musicStarted = true;
    }).catch(() => {});
}


document.addEventListener("click", startMusic, { once: true });
musicBtn.addEventListener("click", () => {
    if (!musicOn) {
        music.volume = DEFAULT_VOLUME;
        music.play();
        fadeIn();
        musicBtn.src = "pictures/sound_on.png";
        musicOn = true;
    } else {
        fadeOut();
        musicBtn.src = "pictures/sound_off.png";
        musicOn = false;
    }
});
function fadeIn() {
    clearInterval(fadeInterval);
    fadeInterval = setInterval(() => {
        if (music.volume < 0.04) {
            music.volume += 0.04;
        } else {
            music.volume = DEFAULT_VOLUME;
            clearInterval(fadeInterval);
        }
    }, 100);
}

function fadeOut() {
    clearInterval(fadeInterval);
    fadeInterval = setInterval(() => {
        if (music.volume > 0.04) {
            music.volume -= 0.04;
        } else {
            music.pause();
            music.volume = 0;
            clearInterval(fadeInterval);
        }
    }, 100);
}
</script>

</body>
</html>
