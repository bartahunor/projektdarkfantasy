<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap-grid.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Jacquard+24&display=swap" rel="stylesheet">
<title>Az Elfeledett Oldalak</title>

<!-- Ékezetbarát pixel font -->
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
    body {
        /*
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0a0a0a url(pictures/hatter.jpg);
        background-size: cover;
        font-family: "VT323", monospace;
        image-rendering: pixelated;
        color: #e0d0c0;
        flex-direction: column;
        */
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        width: 100%;
        height: 100%;

    }

    .felulet{
    background-image: url(pictures/hatter.jpg);
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    min-height: calc(100vh - 80px);
    background-color: black;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;

    padding: 2rem;
    height: 750px;
    width: auto;
    }
    .egesz{
        display: flex;
        flex-direction: row;
        align-items: center;
    }

    .fejlec{
    height: auto;
    min-height: 80px;
    background-color: black;
    font-family: "Jacquard 24", system-ui;
    font-weight: 400;
    font-style: normal;
    color: white;
    text-align: center;
    font-size: 3rem;
    padding-top: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 10px;
    }

    .fejlec h1{
        margin: 0;
        padding: 0;
        line-height: 1;
        border-bottom: 5px solid rgb(232, 229, 229);
        display: inline-block;
    }


    .container {
        background: #1a1a1a;
        padding: 30px;
        text-align: center;
        width: 335px;
        height: 433px;
        background-image: url(pictures/83699ac3965fc80.png);
        background-size: cover;
        font-family: "VT323", monospace;
    }

    h2 {
        font-size: 26px;
        color: #c6626d; 
        margin-bottom: 25px;
        text-shadow: 2px 2px #000;
    }

    input {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border: 3px solid #462226; 
        background: #000;
        color: #c6626d;
        font-family: "VT323", monospace;
        font-size: 22px;
        outline: none;
        box-shadow: 2px 2px #000;
    }

    input:focus {
        border-color: #5F2F34; 
        color: #c6626d;
    }

    button {
        width: 95%;
        padding: 12px;
        margin-top: 15px;
        font-family: "VT323", monospace;
        font-size: 24px;
        cursor: pointer;
        border: 3px solid #5F2F34;
        background-color: #5F2F34; 
        color: #000;
        transition: 0.15s;
    }

    button:hover {
        background-color: #462226; 
        border-color: #462226;
        color: #000;
    }

    .toggle {
        margin-top: 20px;
        display: block;
        cursor: pointer;
        color: #190c0d;
        font-size: 20px;
        font-size: 25px;
    }

    .toggle:hover {
        color: #c6626d; 
    }

    #form-title {
        font-family: "VT323", monospace;
    }

    .container {
    position: relative; 
}

.music-icon {
    position: absolute;
    bottom: 10px;
    right: 10px;

    width: 20px;
    height: 20px;
    cursor: pointer;

    image-rendering: pixelated;
    opacity: 0.8;
}

.music-icon:hover {
    opacity: 1;
}


</style>
</head>

<body>
    <div class="col-md-12 fejlec">
        <h1>AZ ELFELEDETT OLDALAK</h1>
    </div>
    <div class="col-md-12 felulet">

        <div class="egesz">
            <div class="konyvkep">
                <img src="pictures/csukott könyv vegleges.png" alt="" style="width: 550px;">
            </div>

            <div class="container">
                <h2 id="form-title">BEJELENTKEZÉS</h2>

                <input id="username" type="text" placeholder="Felhasználónév">
                <input id="password" type="password" placeholder="Jelszó">
                <input id="email" type="email" placeholder="Email cím" style="display:none;">

                <button id="action-btn">Belépés</button>

                <span class="toggle" id="toggle-mode">Fiók létrehozása</span>

                <img
                    src="pictures/sound_off.png"
                    id="musicToggle"
                    class="music-icon"
                    alt="Zene ki/be"
                    style="background-color: #ffffff; border-radius: 10%; width: 24px; height: 24px; margin-bottom: 7px; margin-right: 7px;">
            </div>

        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="pictures/Tortoise I.mp3" type="audio/mpeg">
    </audio>

<script src="main.js"></script>

</body>
</html>
